server:
  port: 8090
spring:
  application:
    name: subscription-service
  datasource:
    url: jdbc:h2:mem:testdb
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    stream:
      bindings:
        expiringSubscription-out-0:
          destination: expiring-subscription-exchange
        expiredSubscription-out-0:
          destination: expired-subscription-exchange

resilience4j.circuitbreaker:
  configs:
    default:
      sliding-window-size: 10
      permitted-number-of-calls-in-half-open-state: 2
      failure-rate-threshold: 50
      wait-duration-in-open-state:
        seconds: 10

logging:
  level:
    gr:
      georgestaav:
        subscriptionservice: debug