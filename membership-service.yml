server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:testdb
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud: #enable circuit braker for all OpenFeign Clients
    openfeign:
      circuitbreaker:
        enabled: true
    function:
      definition: updateEmailStatus
    stream:
      bindings:
        membershipCreated-out-0:
          destination: membership-created-exchange
        updateEmailStatus-in-0:
          destination: email-confirmation-exchange
          group: ${spring.application.name}


resilience4j.circuitbreaker:
  configs:
    default:
      sliding-window-size: 10
      permitted-number-of-calls-in-half-open-state: 2
      failure-rate-threshold: 50
      wait-duration-in-open-state:
        seconds: 10

resilience4j.ratelimiter:
  configs:
    default:
      timeout-duration:
        seconds: 1
      limit-refresh-period:
        seconds: 5
      limit-for-period: 1

logging:
  level:
    gr:
      georgestaav:
        membershipservice: debug